name: Hourly project continuation

on:
  schedule:
    - cron: '23 * * * *'
    - cron: '30 3 * * *'
    - cron: '*/10 4-15 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Manual action
        required: false
        default: continue
        type: choice
        options:
          - continue
          - finance-sync
          - owner-package-smoke
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.schedule == '*/10 4-15 * * *' && 'finance-recovery' || 'hourly-project-continuation' }}
  cancel-in-progress: false

jobs:
  continue-project:
    name: Guarded PR-only continuation
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 * * * *') ||
      (github.actor_id == 46207692 && github.event_name == 'workflow_dispatch' &&
       inputs.action != 'owner-package-smoke' && inputs.action != 'finance-sync') ||
      (github.actor_id == 46207692 && github.event_name == 'issues' &&
       github.event.issue.user.id == 46207692 && startsWith(github.event.issue.title, '[agent-ready]'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Pull fixed verification sandbox image
        run: docker pull node:24-bookworm-slim

      - name: Continue one bounded project task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURLY_AGENT_ENDPOINT: https://vector-ashk-backend.vercel.app/api/health
        run: node scripts/hourly-project-agent.mjs

  finance-sync:
    name: Finance sync and retry recovery
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *') ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 4-15 * * *') ||
      (github.actor_id == 46207692 && github.event_name == 'workflow_dispatch' && inputs.action == 'finance-sync')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Refresh finance sources through signed OIDC request
        env:
          FINANCE_SYNC_ENDPOINT: https://vector-ashk-backend.vercel.app/api/master-hours-diagnostic
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'NODE'
          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          requestUrl.searchParams.set('audience', 'vector-finance-sync-v1');
          const tokenResponse = await fetch(requestUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          });
          if (!tokenResponse.ok) throw new Error(`OIDC token request failed with ${tokenResponse.status}`);
          const tokenPayload = await tokenResponse.json();
          const token = String(tokenPayload?.value || '').trim();
          if (!token) throw new Error('OIDC token missing');

          const schedule = process.env.GITHUB_EVENT_SCHEDULE || '';
          const kind = process.env.GITHUB_EVENT_NAME !== 'schedule'
            ? 'intraday'
            : schedule === '30 3 * * *' ? 'full' : 'recovery';
          const response = await fetch(process.env.FINANCE_SYNC_ENDPOINT, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${token}`,
              'content-type': 'application/json',
              accept: 'application/json'
            },
            body: JSON.stringify({ mode: 'finance_sync', kind })
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body?.ok !== true) {
            const stages = body?.stages && typeof body.stages === 'object'
              ? Object.fromEntries(Object.entries(body.stages).map(([name, stage]) => [name, {
                  ok: stage?.ok === true,
                  statusCode: stage?.statusCode ?? null,
                  skipped: stage?.skipped === true,
                  errorClass: stage?.errorClass ?? null
                }]))
              : null;
            throw new Error(`finance sync failed with ${response.status}; kind=${kind}; stages=${JSON.stringify(stages)}`);
          }
          console.log(JSON.stringify({ ok: true, kind, mode: body.mode || null, stages: body.stages || null }));
          NODE

  owner-package-smoke:
    name: Owner package production smoke
    if: >-
      github.actor_id == 46207692 &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'owner-package-smoke'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify production owner package
        env:
          OWNER_PACKAGE_SMOKE_ENDPOINT: https://vector-ashk-backend.vercel.app/api/health
        run: |
          node --input-type=module <<'NODE'
          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          requestUrl.searchParams.set('audience', 'vector-owner-package-smoke-v1');
          const tokenResponse = await fetch(requestUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          });
          if (!tokenResponse.ok) throw new Error(`OIDC token request failed with ${tokenResponse.status}`);
          const tokenPayload = await tokenResponse.json();
          const token = String(tokenPayload?.value || '').trim();
          if (!token) throw new Error('OIDC token missing');

          const response = await fetch(process.env.OWNER_PACKAGE_SMOKE_ENDPOINT, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${token}`,
              'content-type': 'application/json',
              accept: 'application/json'
            },
            body: JSON.stringify({ mode: 'owner_package_smoke' })
          });
          const cacheControl = response.headers.get('cache-control') || '';
          const body = await response.json().catch(() => ({}));
          const attestation = body?.attestation;
          const responseIsNoStore = /(?:^|,)\s*no-store(?:\s*(?:,|$)|\s*=)/i.test(cacheControl);
          const attestationIsNoStore = /(?:^|,)\s*no-store(?:\s*(?:,|$)|\s*=)/i.test(String(attestation?.cacheControl || ''));
          const attestationIsFresh = Number.isFinite(attestation?.ageMs) &&
            !(attestation.ageMs < 0 || attestation.ageMs > 300000);
          const safeWithdrawalIsValid = Number.isFinite(attestation?.safeWithdrawal) &&
            !(attestation?.safeWithdrawal < 0);
          const hasUndefinedReserveBlocker = Array.isArray(attestation?.policyBlockers) &&
            attestation.policyBlockers.includes('OPERATING_RESERVE_UNDEFINED');
          const reservePolicyIsValid = Array.isArray(attestation?.policyBlockers) &&
            attestation?.operatingReserveDefined === true &&
            !hasUndefinedReserveBlocker;
          if (
            !response.ok ||
            body?.ok !== true ||
            body?.mode !== 'owner_package_smoke' ||
            !responseIsNoStore ||
            attestation?.ok !== true ||
            attestation?.status !== 200 ||
            !attestationIsNoStore ||
            !attestationIsFresh ||
            !safeWithdrawalIsValid ||
            attestation?.operatingReserveDefined !== true ||
            !reservePolicyIsValid
          ) {
            const allowedFailureCodes = new Set([
              'OWNER_PACKAGE_KEY_UNAVAILABLE',
              'OWNER_PACKAGE_VERIFY_FAILED'
            ]);
            const failureCode = allowedFailureCodes.has(body?.failureCode)
              ? body.failureCode
              : 'OWNER_PACKAGE_UNCLASSIFIED_FAILURE';
            throw new Error(`owner package smoke failed with ${response.status}; failureCode=${failureCode}`);
          }
          console.log(JSON.stringify(body));
          NODE
