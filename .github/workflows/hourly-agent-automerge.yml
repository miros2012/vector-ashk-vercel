name: Hourly agent additive auto-merge

on:
  workflow_run:
    workflows: ["Node test suite"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: hourly-agent-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  additive-automerge:
    name: Verify and merge additive-only agent module
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Merge verified additive-only agent PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/hourly-agent-automerge.mjs
