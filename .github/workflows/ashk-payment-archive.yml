name: ASHK historical payment archive

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First business date (YYYY-MM-DD)
        required: true
        default: '2026-09-01'
        type: string
      end_date:
        description: Last business date (YYYY-MM-DD, at most 31 days)
        required: true
        default: '2026-09-30'
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Export immutable source facts
    if: github.actor_id == '46207692'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout export worker without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Export bounded historical payment facts
        env:
          PAYMENT_ARCHIVE_ENDPOINT: https://vector-ashk-backend.vercel.app/api/master-hours-diagnostic
          ARCHIVE_START_DATE: ${{ inputs.start_date }}
          ARCHIVE_END_DATE: ${{ inputs.end_date }}
          ARCHIVE_OUTPUT_PATH: ashk-payments.enc.json
          ARCHIVE_PUBLIC_KEY_PATH: config/ashk-payment-archive-public-key.pem
        run: node scripts/export-ashk-payment-archive.mjs

      - name: Upload protected archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashk-payments-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: ashk-payments.enc.json
          if-no-files-found: error
          retention-days: 7
