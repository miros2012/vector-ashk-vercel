name: Node test suite

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'preview-*'
      - 'release-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full test suite
        run: npm test
