name: Node test suite

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'preview-*'
      - 'release-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check API entrypoint syntax
        run: find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full test suite
        run: npm test
