name: Node test suite

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'preview-*'
      - 'release-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check API entrypoint syntax
        run: find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full test suite
        run: npm test

  cash-photo-production-smoke:
    name: Cash photo production smoke
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '46207692'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cash-photo-production-smoke
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Upload synthetic photo and verify production readback
        run: node scripts/cash-photo-smoke.mjs
