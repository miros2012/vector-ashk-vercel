name: Finance retry recovery

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Resume checkpointed finance cycle
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout recovery worker without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Drain pending stages through signed OIDC requests
        env:
          FINANCE_SYNC_ENDPOINT: https://vector-ashk-backend.vercel.app/api/master-hours-diagnostic
        run: node scripts/finance-recovery-worker.mjs
