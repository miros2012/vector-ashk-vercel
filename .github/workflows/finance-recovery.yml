name: Finance retry recovery

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Resume checkpointed finance cycle
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Drain pending stages through signed OIDC requests
        env:
          FINANCE_SYNC_ENDPOINT: https://vector-ashk-backend.vercel.app/api/master-hours-diagnostic
        run: |
          node --input-type=module <<'NODE'
          let transientFailures=0;
          for (let step=0; step<24; step++) {
            // Refresh the short-lived identity token for every stage.
            const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            requestUrl.searchParams.set('audience', 'vector-finance-sync-v1');
            const tokenResponse = await fetch(requestUrl, {
              headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(15000)
            });
            if (!tokenResponse.ok) throw new Error(`OIDC request failed: ${tokenResponse.status}`);
            const token = String((await tokenResponse.json())?.value || '').trim();
            if (!token) throw new Error('OIDC token missing');
            let response;
            try { response = await fetch(process.env.FINANCE_SYNC_ENDPOINT, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ mode: 'finance_sync', kind: 'recovery' }),
              signal: AbortSignal.timeout(315000)
            }); } catch {
              response={ok:false,status:503,json:async()=>({ok:false,errorClass:'TRANSPORT_FAILED'})};
            }
            const body = await response.json().catch(() => ({}));
            if (response.status === 409 && body.busy === true) {
              console.log('Finance lease busy; next scheduled recovery will resume.');
              break;
            }
            if (!response.ok || body.ok !== true) {
              const retryable=[429,502,503,504].includes(response.status)
                && !body.blocked
                && ((!body.attempt && [undefined,'CHECKPOINT_FAILED','CYCLE_UNAVAILABLE','TRANSPORT_FAILED'].includes(body.errorClass))
                  || (['REPORT_TRANSPORT','DDS_TRANSPORT','HOURS_TRANSPORT'].includes(body.errorClass) && Number.isInteger(body.attempt) && body.attempt>0 && body.attempt<3));
              if(retryable && ++transientFailures<3 && step<23) {
                console.log(JSON.stringify({retry:true,status:response.status,errorClass:body.errorClass||'TRANSPORT_FAILED'}));
                await new Promise(resolve=>setTimeout(resolve,(['REPORT_TRANSPORT','DDS_TRANSPORT','HOURS_TRANSPORT'].includes(body.errorClass)?30000:2000)*transientFailures));
                continue;
              }
              throw new Error(`Finance recovery failed: ${response.status}; stage=${body.stage || 'unknown'}; error=${body.errorClass || 'unknown'}`);
            }
            transientFailures=0;
            console.log(JSON.stringify({ok:true,stage:body.stage||null,pending:body.pending===true,complete:body.complete===true}));
            if (body.pending !== true || body.deferred === true) break;
            if (step === 23) throw new Error('Finance continuation limit reached; checkpoint retained');
          }
          NODE
